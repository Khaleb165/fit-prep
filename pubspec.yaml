name: fit_prep
description: "A new Flutter project."
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ^3.5.4

dependencies:
  awesome_dio_interceptor: ^1.3.0
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^20.0.0
  flutter_timezone: ^4.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  path: ^1.9.1
  provider: ^6.1.5
  svg_flutter: ^0.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
